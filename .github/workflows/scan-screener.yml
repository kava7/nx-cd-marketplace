name: Screener Scan + Deploy

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      max_stocks:
        description: Max stocks to scan (empty = all)
        required: false
        type: number

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/nxcd-marketplace-mvp
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run screener
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.max_stocks }}" ]; then
            ARGS="${{ inputs.max_stocks }}"
          fi
          python scripts/screener.py $ARGS > src/data/scan-results.json
          echo "Signals found: $(python -c "import json; print(len(json.load(open('src/data/scan-results.json'))))")"

      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "bot@nxcd.com"
          git add src/data/scan-results.json
          if git diff --cached --quiet; then
            echo "No new signals, skipping commit."
          else
            git commit -m "chore: update screener scan results [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=nxcd-indicator-marketplace --branch=codex/nxcd-marketplace-mvp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
